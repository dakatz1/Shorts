# Copy to config/channel.yaml and edit. Layered on top of config/default.yaml.
# Only override what you actually want to change.

providers:
  llm: anthropic
  tts: elevenlabs
  image: replicate
  video: replicate      # real animation; costs the most, changes the most

content:
  mode: satire
  absurdity: 5
  beats: 6

voice:
  style: "breathless conspiracy-doc narrator, heavy pauses before the payoff"

visual:
  layout: split
  split_ratio: 0.6

upload:
  enabled: true
  privacy: private

# Step 1 of the phone workflow: write scripts, render nothing.
#
# Scripts are cheap (a few cents) and rendering is not, so read the copy before
# you spend anything. The pitches are committed to the repo and also posted as
# an issue, which is the part you actually read on a phone.

name: Step 1 - Pitch scripts

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many scripts to write"
        default: "5"
      absurdity:
        description: "How unhinged the payoff claim gets (1-5)"
        type: choice
        options: ["1", "2", "3", "4", "5"]
        default: "4"
      mode:
        description: "satire (disclaimer shown) or deadpan (no disclaimer)"
        type: choice
        options: [satire, deadpan]
        default: satire

permissions:
  contents: write
  issues: write

jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write scripts
        id: pitch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Fall back to the offline writer if no key is configured, so the
          # workflow still demonstrates the loop.
          LLM=stub
          if [ -n "$ANTHROPIC_API_KEY" ]; then LLM=anthropic; fi
          echo "Using script provider: $LLM"

          DIR="pitches/${{ github.run_number }}"
          python -m shorts pitch \
            --count "${{ inputs.count }}" \
            --out-dir "$DIR" \
            --markdown "$RUNNER_TEMP/pitch.md" \
            --set providers.llm=$LLM \
            --set content.absurdity=${{ inputs.absurdity }} \
            --set content.mode=${{ inputs.mode }}
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Commit the pitches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.pitch.outputs.dir }}"
          git commit -m "Add pitches for run ${{ github.run_number }}"
          git push

      - name: Open a review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '${{ steps.pitch.outputs.dir }}';
            const body = [
              fs.readFileSync(process.env.RUNNER_TEMP + '/pitch.md', 'utf8'),
              '\n---\n',
              '### To render these',
              '',
              'Run the **Step 2 - Render videos** workflow with:',
              '',
              '```',
              `scripts: ${dir}`,
              '```',
              '',
              `To render only some, delete the ones you don't want from \`${dir}\` first.`,
              '',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pitches — run ${{ github.run_number }}`,
              body,
              labels: ['pitch'],
            });
